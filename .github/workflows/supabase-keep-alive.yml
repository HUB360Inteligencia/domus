name: Supabase Keep Alive

on:
  schedule:
    - cron: '17 3 * * *'
    - cron: '17 15 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping keep-alive edge function with retries
        env:
          KEEP_ALIVE_URL: https://hdeavqaoikojhlvvidtm.supabase.co/functions/v1/keep-alive
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          for attempt in 1 2 3; do
            status=$(curl --silent --show-error --output /tmp/keep-alive-response.json --write-out '%{http_code}' \
              --request POST \
              --header "Content-Type: application/json" \
              --header "apikey: ${SUPABASE_ANON_KEY}" \
              --header "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
              --header "x-keep-alive-source: github-actions" \
              --data '{"ping":true}' \
              "${KEEP_ALIVE_URL}")

            cat /tmp/keep-alive-response.json

            if [ "$status" = "200" ]; then
              exit 0
            fi

            echo "Attempt ${attempt} failed with status ${status}"

            if [ "$attempt" -lt 3 ]; then
              sleep 10
            fi
          done

          exit 1
